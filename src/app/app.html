<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-title">Directorio</span>
    </a>
    <nav class="site-nav" aria-label="Secciones">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Personajes</a>
      <a routerLink="/favorites" routerLinkActive="is-active">
        Favoritos
        @if (favorites.ids().size > 0) {
          <span class="nav-count">{{ favorites.ids().size }}</span>
        }
      </a>
    </nav>
  </header>

  <main class="site-main">
    <router-outlet />
  </main>

  <footer class="site-footer">
    Catálogo guardado en Firestore.
  </footer>
</div>
