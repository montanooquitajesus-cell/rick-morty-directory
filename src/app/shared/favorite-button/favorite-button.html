<button
  type="button"
  class="favorite-button"
  [class.is-icon]="variant() === 'icon'"
  [class.is-active]="isFavorite()"
  [attr.aria-pressed]="isFavorite()"
  [attr.aria-label]="label()"
  [disabled]="isPending()"
  (click)="onClick()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 20.2 10.6 19C5.4 14.4 2 11.3 2 7.5 2 4.4 4.4 2 7.5 2c1.7 0 3.4.8 4.5 2.1C13.1 2.8 14.8 2 16.5 2 19.6 2 22 4.4 22 7.5c0 3.8-3.4 6.9-8.6 11.5L12 20.2z" />
  </svg>
  @if (variant() === 'text') {
    <span>{{ caption() }}</span>
  }
</button>
